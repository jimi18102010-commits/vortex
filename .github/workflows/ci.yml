name: VORTEX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install Clang & BPF tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm libbpf-dev linux-tools-generic

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Compile eBPF XDP filter
      run: |
        clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I/usr/include -c kernel/xdp_filter.c -o kernel/xdp_filter.o

    - name: Run pytest test suite
      run: |
        pytest tests/
